services:
  access-service:
    image: distributed-programming-access:local
    build:
      context: ./modules/access
      dockerfile: Dockerfile
    environment:
      ACCESS_MYSQL_ADDRESS: mysql:3306
      ACCESS_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${ACCESS_GRPC_PORT:-8081}:8081"
      - "${ACCESS_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  access-message-handler:
    image: distributed-programming-access:local
    command: [message-handler]
    environment:
      ACCESS_MYSQL_ADDRESS: mysql:3306
      ACCESS_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${ACCESS_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      access-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
