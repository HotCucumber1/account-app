services:
  storage-service:
    image: distributed-programming-storage:local
    build:
      context: ./modules/storage
      dockerfile: Dockerfile
    environment:
      STORAGE_MYSQL_ADDRESS: mysql:3306
      STORAGE_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${STORAGE_GRPC_PORT:-8081}:8081"
      - "${STORAGE_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  storage-message-handler:
    image: distributed-programming-storage:local
    command: [message-handler]
    environment:
      STORAGE_MYSQL_ADDRESS: mysql:3306
      STORAGE_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${STORAGE_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      storage-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
