services:
  account-service:
    image: distributed-programming-account:local
    build:
      context: ./modules/account
      dockerfile: Dockerfile
    environment:
      ACCOUNT_MYSQL_ADDRESS: mysql:3306
      ACCOUNT_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${ACCOUNT_GRPC_PORT:-8081}:8081"
      - "${ACCOUNT_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
