services:
  audit-service:
    image: distributed-programming-audit:local
    build:
      context: ./modules/audit
      dockerfile: Dockerfile
    environment:
      AUDIT_MYSQL_ADDRESS: mysql:3306
      AUDIT_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${AUDIT_GRPC_PORT:-8081}:8081"
      - "${AUDIT_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-message-handler:
    image: distributed-programming-audit:local
    command: [message-handler]
    environment:
      AUDIT_MYSQL_ADDRESS: mysql:3306
      AUDIT_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${AUDIT_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      audit-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
